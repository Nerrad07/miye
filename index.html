  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Catering Label Printer</title>
    <style>
      body {
        display: flex;
          font-family: "Arial Black", Impact, "Segoe UI Black", sans-serif;
        margin: 0;
        padding: 20px;
        background: #f2f2f2;
        gap: 20px;
      }

      .panel {
        flex: 1;
        
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      }

      #searchInput {
        width: 95%;
        padding: 10px;
        font-size: 16px;
        margin-bottom: 10px;
      }

      #results li {
        padding: 8px;
        background: #eee;
        margin-top: 5px;
        cursor: pointer;
      }

      #results li:hover {
        background: #ddd;
      }

      #counter {
        margin-top: 10px;
        font-weight: bold;
      }

      #labelSheet {
        display: grid;
        grid-template-columns: repeat(2, 7.5cm);
        grid-template-rows: repeat(8, 2.3cm);
        column-gap: 0.1cm;
        row-gap: 0.1cm;
        width: 15.1cm;
        height: 18.6cm;
        background: white;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .label {
        display: inline-block;
        width: 7.5cm;
        height: 2.8cm;
        margin: 1mm;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        line-height: 1.2;
        vertical-align: middle;
        position: relative; /* Required for positioning the delete button */
        padding-top: 2mm;
        box-sizing: border-box;
        border: none;
        border-radius: 0;
      }

        .label div.delete-btn {
          font-size: 14px;
        }

        .label div:nth-child(2) {
          font-size: 20pt; /* ← name font size */
        }

        .label div:nth-child(3) {
          font-size: 20pt; /* ← class font size */
        }


      .delete-btn {
        position: absolute;
        top: 2mm;
        right: 3mm;
        font-size: 14px;
        color: red;
        background-color: white;
        border-radius: 50%;
        padding: 0 5px;
        font-weight: bold;
        cursor: pointer;
        display: none; /* Hide initially */
        z-index: 999;
      }

      /* Show delete button only when hovering on label */
      .label:hover .delete-btn {
        display: block;
      }

      .max-warning {
        color: red;
        font-weight: bold;
        margin-top: 10px;
      }

      @media print {
        body * {
          visibility: hidden !important;
        }

        #labelSheet, #labelSheet * {
          visibility: visible !important;
        }

        #labelSheet {
          position: absolute;
          top: 0.5%;
          left: 50%;
          transform: translateX(-50%);
        }

        @page {
          size: 15.6cm 19.4cm;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>Label Selection</h2>
      <input type="text" id="searchInput" placeholder="Search name (e.g., jo)">
      <ul id="results"></ul>
      <div id="counter">Selected: 0 / 16</div>
      <div id="maxWarning" class="max-warning" style="display: none;">MAX REACHED</div>
      <button onclick="window.print()">Print Labels</button>
    </div>

    <hr>
  <div style="margin-top: 10px;">
    <select id="templateSelect" style="width: 100%; padding: 5px;"></select>
    <button onclick="loadTemplate()">Load Template</button>
    <button onclick="saveTemplate()">Save Current as Template</button>
    <button onclick="deleteTemplate()">Delete Template</button>
  </div>


    <div class="panel">
      <h2>Label Sheet Preview</h2>
      <div id="printArea">
        <div id="labelSheet"></div>
      </div>
    </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaXWjq3rn350YwLPhaUr8pWylJctuOplqLbmAknamcvu3piCxTe_1fsFJK5wjVLcULBg/exec";

  const searchInput = document.getElementById("searchInput");
  const resultsList = document.getElementById("results");
  const labelSheet = document.getElementById("labelSheet");
  const counter = document.getElementById("counter");
  const maxWarning = document.getElementById("maxWarning");

  let selectedCount = 0;
  const labelOccurrences = {};
  let allPeople = [];  // ← Preloaded data

  // Load data once
  async function preloadData() {
    const res = await fetch(API_URL);
    allPeople = await res.json();
  }
  preloadData();

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.trim().toLowerCase();
    resultsList.innerHTML = "";

    if (query.length < 1 || selectedCount >= 16) return;

    const filtered = allPeople.filter(person =>
      person.name.toLowerCase().includes(query)
    );

    filtered.slice(0, 10).forEach(person => {
      const li = document.createElement("li");
      li.textContent = person.name;
      li.addEventListener("click", () => selectPerson(person));
      resultsList.appendChild(li);
    });
  });

  function selectPerson(person) {
    const nameKey = person.name.toLowerCase();
    if (selectedCount >= 16) return;

    if (!labelOccurrences[nameKey]) {
      labelOccurrences[nameKey] = 1;
    } else if (labelOccurrences[nameKey] >= 2) {
      alert(`${person.name} is already added twice.`);
      return;
    } else {
      labelOccurrences[nameKey]++;
    }

    const label = document.createElement("div");
    label.className = "label";
    label.innerHTML = `
      <div class="delete-btn" onclick="deleteLabel(this, '${nameKey}')">✕</div>
      <div>${person.name}</div>
      <div>${person.class}</div>
    `;

    labelSheet.appendChild(label);
    selectedCount++;
    counter.textContent = `Selected: ${selectedCount} / 16`;

    if (selectedCount === 16) {
      maxWarning.style.display = "block";
      searchInput.disabled = true;
    }

    resultsList.innerHTML = ""; // clear suggestion box
    searchInput.value = ""; // reset search
  }

  function deleteLabel(btn, nameKey) {
    const label = btn.parentElement;
    label.remove();

    selectedCount--;
    labelOccurrences[nameKey]--;
    counter.textContent = `Selected: ${selectedCount} / 16`;

    if (selectedCount < 16) {
      maxWarning.style.display = "none";
      searchInput.disabled = false;
    }
  }

    const MAX_TEMPLATES = 20;

    function getTemplates() {
      return JSON.parse(localStorage.getItem("labelTemplates") || "{}");
    }

    function saveTemplate() {
      const name = prompt("Template name (e.g., Monday, Event A):");
      if (!name) return;

      const templates = getTemplates();
      if (Object.keys(templates).length >= MAX_TEMPLATES && !templates[name]) {
        alert("Template limit reached (20). Delete one first.");
        return;
      }

      const labels = [...document.querySelectorAll(".label")];
      const data = labels.map(label => {
        const name = label.children[1].textContent;
        const cls = label.children[2].textContent;
        return { name, class: cls };
      });

      templates[name] = data;
      localStorage.setItem("labelTemplates", JSON.stringify(templates));
      refreshTemplateOptions();
      alert(`Template '${name}' saved!`);
    }

    function loadTemplate() {
      const name = document.getElementById("templateSelect").value;
      if (!name) return;

      clearLabels();

      const templates = getTemplates();
      const data = templates[name] || [];

      data.forEach(p => selectPerson({ name: p.name, class: p.class }));
    }

    function deleteTemplate() {
      const name = document.getElementById("templateSelect").value;
      if (!name) return;

      const templates = getTemplates();
      delete templates[name];
      localStorage.setItem("labelTemplates", JSON.stringify(templates));
      refreshTemplateOptions();
      alert(`Template '${name}' deleted.`);
    }

    function refreshTemplateOptions() {
      const select = document.getElementById("templateSelect");
      select.innerHTML = "<option value=''>-- Select Template --</option>";
      const templates = getTemplates();
      Object.keys(templates).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function clearLabels() {
      labelSheet.innerHTML = "";
      selectedCount = 0;
      counter.textContent = `Selected: 0 / 16`;
      searchInput.disabled = false;
      maxWarning.style.display = "none";
      for (const key in labelOccurrences) {
        labelOccurrences[key] = 0;
      }
    }

    // Load on startup
    window.addEventListener("DOMContentLoaded", refreshTemplateOptions);

  </script>
